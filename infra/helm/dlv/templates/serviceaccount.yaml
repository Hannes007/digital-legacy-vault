{{- range $c := list "api" "web" "worker" }}
{{- $svc := index $.Values $c }}
{{- if and $svc.enabled $svc.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.serviceAccount.name | default (printf "%s-%s" (include "dlv.fullname" $) $c) }}
  labels:
    {{- include "dlv.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ include "dlv.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $c }}
  {{- with $svc.serviceAccount.roleArn }}
  annotations:
    # IRSA — pods assume this IAM role instead of node credentials (least privilege).
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- end }}

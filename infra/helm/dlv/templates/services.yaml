{{- range $c := list "api" "web" }}
{{- $svc := index $.Values $c }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dlv.fullname" $ }}-{{ $c }}
  labels:
    {{- include "dlv.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ include "dlv.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $c }}
spec:
  type: {{ $svc.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "dlv.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $c }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}

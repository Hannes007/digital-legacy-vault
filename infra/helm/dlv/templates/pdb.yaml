{{- range $c := list "api" "web" "worker" }}
{{- $svc := index $.Values $c }}
{{- if and $svc.enabled $svc.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dlv.fullname" $ }}-{{ $c }}
  labels:
    {{- include "dlv.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dlv.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $c }}
{{- end }}
{{- end }}

{{- range $c := list "api" "web" "worker" }}
{{- $svc := index $.Values $c }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dlv.fullname" $ }}-{{ $c }}
  labels:
    {{- include "dlv.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c }}
data:
  {{- range $k, $v := $svc.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}

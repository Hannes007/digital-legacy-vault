{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dlv.fullname" . }}
  labels:
    {{- include "dlv.commonLabels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Order matters: /api routes to the API before the web catch-all.
          {{- if .Values.api.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "dlv.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          {{- end }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dlv.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
          {{- end }}
{{- end }}
